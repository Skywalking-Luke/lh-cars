name: Convert MG photos to real JPEGs
on:
  push:
    branches: [main]
    paths:
      - "assets/img/**.jpg"
      - "scripts/unwrap-images.py"
      - ".github/workflows/decode-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unwrap JPEG-in-SVG files
        run: python3 scripts/unwrap-images.py
      - name: Commit real JPEGs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898297+github-actions[bot]@users.noreply.github.com"
            git add -A assets/img _headers
            git commit -m "chore: convert MG photos to real JPEG files"
            git push
          else
            echo "Nothing to convert"
          fi
