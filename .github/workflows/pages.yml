name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 JPEG sidecars
        run: |
          set -e
          if [ -d assets ]; then
            find assets -name '*.jpg.b64' -print0 2>/dev/null | while IFS= read -r -d '' f; do
              out="${f%.b64}"
              base64 -d "$f" > "$out"
              echo "decoded $out"
            done
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
